# Complete logging & monitoring stack for srv35.mikr.us
# Includes: Prometheus + Loki + Grafana + Promtail
# Deploy to: /opt/logging
# App (shapyfy-core) runs separately in /opt/shapyfy
# Access Grafana at: http://srv35.mikr.us:40087

version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.3
    container_name: shapyfy-loki
    ports:
      - "3100:3100"  # Internal port for Promtail
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.3
    container_name: shapyfy-grafana
    ports:
      - "40087:3000"  # Grafana UI on Mikrus port 40087
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=shapyfy123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://srv35.mikr.us:40087
      - GF_LOG_LEVEL=info
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - logging
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.3
    container_name: shapyfy-promtail
    volumes:
      - ./config/promtail/promtail-docker-logs.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - logging
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: shapyfy-prometheus
    ports:
      - "9090:9090"  # Internal port for Prometheus UI
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  logging:
    driver: bridge
