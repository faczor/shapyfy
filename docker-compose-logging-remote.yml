# This runs on the LOGGING SERVER (Server 2)
# Access Grafana at: http://<logging-server-ip>:3000

version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.3
    container_name: shapyfy-loki
    ports:
      - "3100:3100"  # Exposed to network for remote Promtail
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: shapyfy-grafana
    ports:
      - "3000:3000"  # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=shapyfy123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://<YOUR_LOGGING_SERVER_IP>:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - logging
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  logging:
    driver: bridge
