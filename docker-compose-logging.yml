version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.3
    container_name: shapyfy-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - logging

  promtail:
    image: grafana/promtail:2.9.3
    container_name: shapyfy-promtail
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml
      - ./logs:/var/log/shapyfy
    command: -config.file=/etc/promtail/config.yml
    networks:
      - logging
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.3
    container_name: shapyfy-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=shapyfy123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - logging
    depends_on:
      - loki

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  logging:
    driver: bridge
