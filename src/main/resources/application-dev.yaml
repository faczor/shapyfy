# Dev Server Configuration (Docker)
# Uses environment variables from docker-compose.yml and .env file

spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    show-sql: false  # Disable SQL logging in dev server

# Firebase
firebase:
  project-id: ${FIREBASE_PROJECT_ID:shapyfy-dev}

# Anthropic API
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

# Sentry
sentry:
  dsn: ${SENTRY_DSN:}
  environment: development
  traces-sample-rate: 1.0  # Full tracing in dev
  enable-tracing: true

# Logging
logging:
  level:
    com.shapyfy: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
