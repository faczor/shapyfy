# Dev Server Configuration (Docker)
# Uses environment variables from docker-compose.yml and .env file

spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    show-sql: false  # Disable SQL logging in dev server

# Sentry (enabled for dev)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: development
  traces-sample-rate: 0.1  # Reduced from 1.0 to improve startup performance
  enable-tracing: true

# Logging
logging:
  level:
    com.shapyfy: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
