# Local Development Configuration
# Uses .env file for secrets (loaded by Spring Boot automatically)
# Run with: ./gradlew bootRun --args='--spring.profiles.active=local'

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true

# Firebase (local testing)
firebase:
  project-id: ${FIREBASE_PROJECT_ID:shapyfy-dev}

# Anthropic API
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

# Sentry (optional for local)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: local
  traces-sample-rate: 0.0  # Disable tracing in local
