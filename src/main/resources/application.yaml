# Base Application Configuration
# Common settings shared across all environments
# Environment-specific settings are in application-{profile}.yaml

spring:
  application:
    name: shapyfy-core

  # Datasource configuration (requires environment variables)
  datasource:
    url: jdbc:postgresql://${DB_SERVER}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Flyway database migrations
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    enabled: true

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${FIREBASE_JWK_SET_URI}

  # Jackson JSON configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
    export:
      prometheus:
        enabled: true

# Server configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Firebase Configuration
firebase:
  project-id: ${FIREBASE_PROJECT_ID}

# Anthropic API
anthropic:
  api-key: ${ANTHROPIC_API_KEY}

