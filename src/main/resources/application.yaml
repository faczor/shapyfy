# Base Application Configuration
# Common settings shared across all environments
# Environment-specific settings are in application-{profile}.yaml

spring:
  application:
    name: shapyfy-core

  # Datasource configuration (uses environment variables)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Flyway database migrations
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    enabled: true

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}

  # Jackson JSON configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Server configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

