services:
  shapyfy-core:
    image: ghcr.io/${GITHUB_REPOSITORY:-shapyfy/core}:latest
    container_name: shapyfy-core
    restart: unless-stopped
    ports:
      - "40086:8080"
    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 1024m
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}
      # Database configuration (used by application.yaml)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # Firebase configuration
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_JWK_SET_URI=${FIREBASE_JWK_SET_URI}
      # Anthropic API
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Sentry monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    env_file:
      - .env
    networks:
      - shapyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

networks:
  shapyfy-network:
    driver: bridge
