name: Build and Deploy

on:
  push:
    branches:
      - kotlin-main
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Jib
        run: |
          ./gradlew jib --no-daemon \
            -Djib.to.image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -Djib.to.tags=${{ github.sha }} \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Image summary
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`latest\`, \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View package:** https://github.com/${{ github.repository }}/pkgs/container/shapyfy" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy to Dev
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/kotlin-main'
    environment:
      name: dev

    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_JWK_SET_URI: ${{ secrets.FIREBASE_JWK_SET_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: development
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPRING_PROFILES_ACTIVE: dev
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DB_SERVER,DB_NAME,DB_SCHEMA,DB_USERNAME,DB_PASSWORD,FIREBASE_PROJECT_ID,FIREBASE_JWK_SET_URI,ANTHROPIC_API_KEY,SENTRY_DSN,SENTRY_ENVIRONMENT,GITHUB_REPOSITORY,SPRING_PROFILES_ACTIVE
          script: |
            cd /opt/shapyfy

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create/update .env file with secrets from GitHub
            cat > .env << EOF
            DB_SERVER=${DB_SERVER}
            DB_NAME=${DB_NAME}
            DB_SCHEMA=${DB_SCHEMA}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
            FIREBASE_JWK_SET_URI=${FIREBASE_JWK_SET_URI}
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            SENTRY_DSN=${SENTRY_DSN}
            SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}
            GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
            SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
            EOF
            chmod 600 .env

            # Pull the latest image
            docker compose pull

            # Restart the container with new image
            docker compose up -d --force-recreate

            # Clean up old images
            docker image prune -af

            # Show status
            docker compose ps

            # Wait for application to start (Spring Boot takes ~30-40 seconds)
            echo "Waiting for application to start..."
            sleep 30
            docker compose logs --tail=50

      - name: Verify Dev Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/shapyfy

            # Check if container is running
            if ! docker ps | grep -q shapyfy-core; then
              echo "❌ Container is not running"
              exit 1
            fi

            echo "✅ Container is running"

            # Wait for app to be healthy (retry for up to 60 seconds)
            echo "Waiting for health check to pass..."
            for i in {1..12}; do
              if docker compose exec -T shapyfy-core wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health 2>/dev/null; then
                echo "✅ Health check passed"
                exit 0
              fi
              echo "Attempt $i/12: Application still starting..."
              sleep 5
            done

            echo "❌ Health check failed after 60 seconds"
            docker compose logs --tail=100
            exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Dev Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Dev" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ secrets.SERVER_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`kotlin-main\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
