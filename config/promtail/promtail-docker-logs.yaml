# Promtail configuration for reading Docker container logs
# This runs on srv35.mikr.us alongside the application and Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://shapyfy-loki:3100/loki/api/v1/push

scrape_configs:
  # Read logs from Docker containers
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["shapyfy-core"]

    relabel_configs:
      # Use container name as label
      - source_labels: ['__meta_docker_container_name']
        target_label: container
        replacement: '$1'

      # Add container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
        regex: '(.{12}).*'
        replacement: '$1'

      # Add image name
      - source_labels: ['__meta_docker_container_image']
        target_label: image

    pipeline_stages:
      # Parse JSON logs from Spring Boot
      - json:
          expressions:
            timestamp: timestamp
            level: level
            thread: thread
            logger: logger
            message: message
            trace_id: trace_id
            span_id: span_id
            user_id: user_id
            request_id: request_id
            application: application
            environment: environment

      # Use timestamp from log entry
      - timestamp:
          source: timestamp
          format: RFC3339

      # Extract important fields as labels for filtering
      - labels:
          level:
          application:
          environment:

      # Output the message
      - output:
          source: message
